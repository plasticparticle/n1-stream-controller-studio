name: Build Debian package

on:
  release:
    types:
      - published

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-deb:
    name: Build and attest amd64 Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            file \
            git \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            python3-venv

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            driver/build-requirements.txt
            driver/requirements.txt

      - name: Set up pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"

          if [[ "${package_version}" != "${tauri_version}" || "${package_version}" != "${cargo_version}" ]]; then
            echo "Version mismatch: package=${package_version}, tauri=${tauri_version}, cargo=${cargo_version}" >&2
            exit 1
          fi

          if [[ "${RELEASE_TAG}" != "v${package_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match project version v${package_version}." >&2
            exit 1
          fi

          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Create pinned driver build environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install \
            --no-build-isolation \
            --require-hashes \
            -r driver/build-requirements.txt
          .venv/bin/python -m pip install \
            --no-build-isolation \
            --require-hashes \
            -r driver/requirements.txt

      - name: Run checks
        run: npm run check

      - name: Build Debian package
        run: SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" npm run build

      - name: Create and verify package checksum
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/deb
          sha256sum -- *.deb > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Generate signed build provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: src-tauri/target/release/bundle/deb/*.deb

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: n1-stream-controller-studio-${{ steps.version.outputs.version }}-amd64-deb
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/SHA256SUMS
          if-no-files-found: error

  publish-release:
    name: Publish verified release assets
    needs: build-deb
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified workflow artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: n1-stream-controller-studio-*-amd64-deb
          path: release
          merge-multiple: true

      - name: Recheck package checksum
        run: cd release && sha256sum --check SHA256SUMS

      - name: Attach package and checksum to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" release/*.deb release/SHA256SUMS --clobber
